map "$status:$uri" $loggable {
    default 1;
    ~^[23][0-9][0-9]:.*\.(css|js|wasm|png|ico|woff2?)$ 0;
}

log_format concise '$remote_addr $request_method $uri $status ${request_time}s';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    access_log /dev/stdout concise if=$loggable;
    error_log /dev/stderr warn;

    location / {
        try_files $uri /index.html;
    }
}
